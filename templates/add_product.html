```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Product</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/add_product.css') }}">
</head>

<body>

    <div class="product-container">

        <h1>Add Product</h1>

        <p class="subtitle">
            Register a new product
        </p>

        <form action="{{ url_for('add_product') }}" method="POST">

            <!-- Product Name -->
            <div class="form-group">

                <label for="product_name">
                    Product Name
                </label>

                <input
                    type="text"
                    id="product_name"
                    name="product_name"
                    placeholder="Enter product name"
                    required
                >

            </div>


            <!-- Product ID -->
            <div class="form-group">

                <label for="product_id">
                    Product ID
                </label>

                <input
                    type="text"
                    id="product_id"
                    name="product_id"
                    placeholder="Enter unique product ID"
                    required
                >

            </div>


            <!-- Submit -->
            <button type="submit">
                Add Product
            </button>

        </form>


        <a href="{{ url_for('manufacturer_dashboard') }}"
           class="back-link">
            Back to Dashboard
        </a>

    </div>

</body>

</html>
```
